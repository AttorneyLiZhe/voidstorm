<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VOIDSTORM — neon arena survival</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05070f; }
  body { display: flex; align-items: center; justify-content: center; }
  #game {
    display: block;
    width: min(100vw, 177.78vh);
    height: min(56.25vw, 100vh);
    touch-action: none;
    cursor: crosshair;
  }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="VOIDSTORM: fly with WASD or the arrow keys, aim with the mouse, hold click or Space to fire, gather salvage to level up and survive the waves"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
